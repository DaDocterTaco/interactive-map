name: Test FIU events
on:
  push:
    paths: ['get_events.py', '*events*', 'event-utils.mjs', 'buildings.json', 'tests/**', '.github/workflows/*events.yml']
  pull_request:
    paths: ['get_events.py', '*events*', 'event-utils.mjs', 'buildings.json', 'tests/**', '.github/workflows/*events.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_events.py'
      - run: node --test tests/event-utils.test.mjs
