<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#071d4b">
    <title>FIU Navigator · Modesto A. Maidique Campus</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="LiveChat/bottomSheet.css?v=polish-3">
    <link rel="stylesheet" href="LiveChat/mapWarnings.css">
    <link rel="stylesheet" href="ClassSearch/classSearch.css">
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="ActionBar/actionBar.css">
    <script src="ActionBar/actionBar.js" defer></script>
    <script src="LiveChat/mapChat.js?v=polish-3" defer></script>
    <script src="app.js" defer></script>
</head>
<body class="map-page">
    <main class="app-shell">
        <div id="map" role="application" aria-label="Interactive map of FIU Modesto A. Maidique Campus"></div>
        <header class="app-header" aria-label="Campus navigation">
            <div class="brand-mark" aria-hidden="true">FIU</div>
            <div class="brand-copy"><strong>FIU Navigator</strong><span>Modesto A. Maidique Campus</span></div>
            <span class="campus-pill"><span aria-hidden="true">●</span> MMC campus</span>
        </header>
        <p id="chat-status" role="status"></p>
        <div class="map-hint" aria-hidden="true">Drag to explore · Select a marker for details</div>
    </main>
    <section id="chat-container" class="assistant-panel" aria-labelledby="assistant-title" hidden>
        <header class="assistant-header"><div><span class="assistant-spark" aria-hidden="true">✦</span><div><h2 id="assistant-title">FIU Campus Assistant</h2><p>Ask about buildings or events</p></div></div><button id="close-assistant" type="button" aria-label="Close assistant">×</button></header>
        <div id="chat-history" class="assistant-history" role="log" aria-live="polite" aria-relevant="additions"><div class="assistant-message">Hi! What would you like to know about campus?</div></div>
        <form id="assistant-form" class="assistant-form"><label for="chat-input" class="sr-only">Your question</label><input id="chat-input" type="text" placeholder="Ask a question..." autocomplete="off" maxlength="1000" required><button type="submit">Send</button></form>
    </section>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Feature modules share this map and add their own independent markers.
        const map = L.map('map', { zoomControl: false }).setView([25.75396, -80.37662], 16);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
    </script>
    <script src="Locations.JS?v=clean-rss-1"></script>
    <script type="module" src="firebase.js"></script>
    <script type="module">
        import { mountMapWarnings } from './LiveChat/mapWarnings.js';
        import { mountClassSearch } from './ClassSearch/classSearch.js';
        mountMapWarnings({ map, L });
        mountClassSearch({ map, L });
    </script>


    <!-- This will be for the AI Chatbot functionality-->
     <!-- Chat UI -->
    <div id="chat-container" style="position: fixed; bottom: 25px; right: 15px; width: 400px; height: 500px; background: white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); display: flex; flex-direction: column; z-index: 1000; font-family: sans-serif;">
    
    <!-- Header -->
    <div style="background: #081e3f; color: white; padding: 10px; border-radius: 10px 10px 0 0; font-weight: bold; text-align: center;">
        FIU Campus Assistant
    </div>
    
    <!-- Message History -->
    <div id="chat-history" style="flex: 1; padding: 10px; overflow-y: auto; background: #f9f9f9; display: flex; flex-direction: column; gap: 8px;">
        <div style="background: #e0e0e0; padding: 8px; border-radius: 8px; align-self: flex-start; max-width: 80%;">
            Hello! Ask me about buildings or events on campus.
        </div>
    </div>
    
    <!-- Input Area -->
    <div style="padding: 10px; border-top: 1px solid #ddd; display: flex; gap: 5px;">
        <input type="text" id="chat-input" placeholder="Type a question..." style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        <button onclick="sendMessage()" style="background: #cc9900; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">Send</button>
    </div>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('chat-input');
            const message = inputField.value.trim();
            
            // Don't send empty messages
            if (!message) return;

            const chatHistory = document.getElementById('chat-history');

            // 1. Add the User's message to the chat window (Blue Bubble)
            chatHistory.innerHTML += `
                <div style="background: #081e3f; color: white; padding: 8px; border-radius: 8px; align-self: flex-end; max-width: 80%;">
                    ${message}
                </div>
            `;
            
            // Clear the input box
            inputField.value = '';
            // Auto-scroll to the bottom
            chatHistory.scrollTop = chatHistory.scrollHeight;

            // --- Add a temporary 'Typing...' bubble ---
            const typingId = 'typing-' + Date.now(); // Give it a unique ID
            chatHistory.innerHTML += `
                <div id="${typingId}" style="background: #e0e0e0; color: #555; padding: 8px; border-radius: 8px; align-self: flex-start; max-width: 80%; font-style: italic;">
                    Typing...
                </div>
            `;
            chatHistory.scrollTop = chatHistory.scrollHeight;

            try {
                // 2. Send the message to your Python Flask server
                const response = await fetch('http://127.0.0.1:5000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                // Wait for Gemini to generate the answer
                const data = await response.json();

                // --- NEW: Remove the 'Typing...' bubble before showing the answer ---
                document.getElementById(typingId).remove();

                // 3. Add the AI's response to the chat window (Gray Bubble)
                chatHistory.innerHTML += `
                    <div style="background: #e0e0e0; color: black; padding: 8px; border-radius: 8px; align-self: flex-start; max-width: 80%;">
                        ${marked.parse(data.reply)}
                    </div>
        `;
                
                // Auto-scroll to the bottom again
                chatHistory.scrollTop = chatHistory.scrollHeight;

            } catch (error) {
                console.error("Error connecting to chat server:", error);
                
                // Fallback error message if the Python server isn't running
                chatHistory.innerHTML += `
                    <div style="background: #ffcccc; color: #900; padding: 8px; border-radius: 8px; align-self: flex-start; max-width: 80%;">
                        Connection error. Make sure your Python server is running!
                    </div>
                `;
            }
        }

        // Bonus: Allow pressing the "Enter" key to send the message
        document.getElementById('chat-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>

</body>
</html>
